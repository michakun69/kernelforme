name: "Build kernels"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/topnotchfreaks/kernel_msm-5.15"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "codelinaro"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "ksu"
        options:
          - "noksu"
          - "ksu"
          - "both"
      ksuRef:
        description: "KernelSU tag/commit (empty = latest tag)"
        required: false
        type: string
        default: ""
      ksuManagerSize:
        description: "Trust a different manager app: signature size, e.g. 0x033b (empty = official)"
        required: false
        type: string
        default: ""
      ksuManagerHash:
        description: "Trust a different manager app: signature sha256 (empty = official)"
        required: false
        type: string
        default: ""

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "📂 Checkout builder repo (patches)"
        uses: actions/checkout@v4
        with:
          path: _builder

      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 15GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 15
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize repo"
        working-directory: ${{ env.WORK_DIR}}
        run: |
         repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
         repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
    
         rm -rf .repo
         rm -rf common

         # Clean up old Clang versions
         rm -rf prebuilts/clang/host/linux-x86/clang-3289846
         rm -rf prebuilts/clang/host/linux-x86/clang-stable
         
         sed -i \
          -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
          -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r450784e/' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
    
         sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

         sed -i \
          -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
          -e '/^TRIM_NONLISTED_KMI=/d' \
          -e '/^KMI_ENFORCED=/d' \
          -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
          -e '$a\TRIM_NONLISTED_KMI=0' \
          -e '$a\KMI_ENFORCED=0' \
          -e '/^MODULES_ORDER=/d' \
          -e '/^MODULES_LIST=/d' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          # Define the config file path
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Set localversion
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
          fi
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "🔧 Setup KernelSU (latest, no SUSFS, no mount patches)"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          KSU_REF: ${{ github.event.inputs.ksuRef }}
          KSU_SIZE: ${{ github.event.inputs.ksuManagerSize }}
          KSU_HASH: ${{ github.event.inputs.ksuManagerHash }}
        run: |
          set -e
          rm -rf ./KernelSU ./drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig

          # official setup script: clones tiann/KernelSU, links drivers/kernelsu, wires Makefile+Kconfig
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s -- ${KSU_REF}
          echo "KernelSU at: $(git -C KernelSU describe --tags --always)"

          # optionally trust a different manager app (e.g. a fork's) instead of the official one
          if [ -n "$KSU_SIZE" ] && [ -n "$KSU_HASH" ]; then
            echo "KSU_EXPECTED_SIZE=$KSU_SIZE" >> "$GITHUB_ENV"
            echo "KSU_EXPECTED_HASH=$KSU_HASH" >> "$GITHUB_ENV"
            echo "Custom manager signature: $KSU_SIZE $KSU_HASH"
          fi

          echo "CONFIG_KSU=y" >> "arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

      - name: "⚡ Apply 120Hz lock, -O3, quiet logging"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          set -e
          for p in ${{ env.WORK_DIR }}/_builder/patches/*.patch; do
            echo "🔧 Applying $p"
            patch -p1 --forward < "$p"
          done

          CFG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          # drop any earlier values so ours win cleanly
          for k in CC_OPTIMIZE_FOR_PERFORMANCE CC_OPTIMIZE_FOR_PERFORMANCE_O3 CC_OPTIMIZE_FOR_SIZE \
                   PRINTK_TIME PRINTK_CALLER PSTORE_CONSOLE PSTORE_PMSG PAGE_OWNER \
                   CONSOLE_LOGLEVEL_DEFAULT CONSOLE_LOGLEVEL_QUIET MESSAGE_LOGLEVEL_DEFAULT \
                   DRM_FORCE_120HZ HZ HZ_100 HZ_250 HZ_300 HZ_1000 CMDLINE LOG_BUF_SHIFT \
                   UNMAP_KERNEL_AT_EL0 MITIGATE_SPECTRE_BRANCH_HISTORY \
                   IOSCHED_BFQ BFQ_GROUP_IOSCHED MQ_IOSCHED_KYBER LRU_GEN_ENABLED \
                   RCU_LAZY_DEFAULT_OFF; do
            sed -i "/^CONFIG_${k}=/d;/^# CONFIG_${k} is not set/d" "$CFG"
          done

          cat >> "$CFG" << 'EOF'
          CONFIG_DRM_FORCE_120HZ=y
          # CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y
          # CONFIG_PRINTK_TIME is not set
          # CONFIG_PRINTK_CALLER is not set
          # CONFIG_PSTORE_CONSOLE is not set
          # CONFIG_PSTORE_PMSG is not set
          # CONFIG_PAGE_OWNER is not set
          CONFIG_CONSOLE_LOGLEVEL_DEFAULT=1
          CONFIG_CONSOLE_LOGLEVEL_QUIET=1
          CONFIG_MESSAGE_LOGLEVEL_DEFAULT=1
          CONFIG_LOG_BUF_SHIFT=12
          # tick: arm64 has no 50Hz option, 100 is the lowest
          # CONFIG_HZ_250 is not set
          CONFIG_HZ_100=y
          CONFIG_HZ=100
          # CPU-side mitigations (KPTI + branch-history). Other mitigations are
          # turned off at boot via mitigations=off in CMDLINE below.
          # CONFIG_UNMAP_KERNEL_AT_EL0 is not set
          # CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY is not set
          # memory/zram: stock (left untouched on purpose)
          # Lazy RCU (battery): already in this tree, just default it on. Only
          # takes effect on offloaded CPUs, hence rcu_nocbs= in the cmdline.
          # CONFIG_RCU_LAZY_DEFAULT_OFF is not set
          # I/O: BFQ is the heaviest scheduler and nothing on a phone needs it;
          # mq-deadline (+kyber) stay. The active scheduler is picked at runtime
          # by the module (elevator= is ignored on 5.15).
          # CONFIG_IOSCHED_BFQ is not set
          # CONFIG_BFQ_GROUP_IOSCHED is not set
          # CONFIG_MQ_IOSCHED_KYBER is not set
          # Multi-gen LRU on by default: better reclaim -> more apps stay cached
          CONFIG_LRU_GEN_ENABLED=y
          # Keep the stock GKI params, append ours (CMDLINE_EXTEND is already on)
          CONFIG_CMDLINE="stack_depot_disable=on kasan.stacktrace=off kvm-arm.mode=protected cgroup_disable=pressure mitigations=off nowatchdog nosoftlockup nmi_watchdog=0 quiet loglevel=0 printk.devkmsg=off rcu_nocbs=0-7 init_on_alloc=0 init_on_free=0 randomize_kstack_offset=off"
          EOF
          echo "✅ patches + config tweaks applied"

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "🔎 Show effective config (what actually got applied)"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          CFG=$(find out -maxdepth 4 -name .config | head -1)
          echo "config: $CFG"
          grep -E "^(# )?CONFIG_(HZ|HZ_100|HZ_250|RCU_LAZY|RCU_LAZY_DEFAULT_OFF|RCU_NOCB_CPU|KSU|INIT_ON_ALLOC_DEFAULT_ON|IOSCHED_BFQ|MQ_IOSCHED_DEADLINE|MQ_IOSCHED_KYBER|LRU_GEN|LRU_GEN_ENABLED|CC_OPTIMIZE_FOR_PERFORMANCE_O3|DRM_FORCE_120HZ|UNMAP_KERNEL_AT_EL0|MITIGATE_SPECTRE_BRANCH_HISTORY|ZRAM_DEF_COMP|LOG_BUF_SHIFT|PRINTK_TIME|PSTORE_CONSOLE|CMDLINE|CMDLINE_EXTEND|CONSOLE_LOGLEVEL_DEFAULT)[= ]" "$CFG" || true

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cp out/dist/Image Image.${{ matrix.variant }}

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/Image.${{ matrix.variant }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          
          # Only this phone: keep tapas (+ topaz, same board, some ports report it);
          # drop the other devices' entries from the flasher's device check.
          sed -i '/^device\.name[3-9]=/d' AnyKernel3/anykernel.sh
          grep -q '^device.name1=topaz' AnyKernel3/anykernel.sh && \
          grep -q '^device.name2=tapas' AnyKernel3/anykernel.sh || { echo "❌ device list edit failed"; exit 1; }
          grep -n '^device\.name' AnyKernel3/anykernel.sh

          # Copy kernels
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Create ZIP
          ZIP_NAME="Anykernel3_tapas_KernelSU_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📱 Send to Telegram"
        if: always()
        run: |
          if [[ -f "${{ env.ZIP_PATH }}" ]]; then
            curl -s -F document=@"${{ env.ZIP_PATH }}" \
                 -F caption="✅ Kernel Build Complete (WildKSU) - $(date '+%Y-%m-%d %H:%M:%S')" \
                 -F chat_id=${{ secrets.TELEGRAM_USER_ID }} \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            curl -s -X POST \
                 -d chat_id=${{ secrets.TELEGRAM_USER_ID }} \
                 -d text="❌ Kernel build failed" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          fi
